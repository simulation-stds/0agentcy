[package]
name = "simulation-studio"
version = "0.1.0"
description = "Local creative media tools for Windows"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_video_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-mcp-bridge = "0.11.2"
tauri-plugin-dialog = "2"
ureq = { version = "3.3.0", features = ["json", "multipart"] }
zip = "8.6.0"
tempfile = "3.27.0"
sha2 = "0.10"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
http-body-util = "0.1"
http-range = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
